services:
  postgres:
    image: postgres:18-alpine
    container_name: tickstream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickstream
    ports: ["5432:5432"]
    volumes: ["tickstream-pgdata:/var/lib/postgresql"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tickstream"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    container_name: tickstream-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["tickstream-redisdata:/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tickstream-pgdata:
  tickstream-redisdata:
